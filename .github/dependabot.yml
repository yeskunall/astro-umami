version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    allow:
      - dependency-name: pullfrog/pullfrog
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - type/chore
      - area/dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - type/chore
      - area/dependencies
    groups:
      # Group ESLint dependencies together
      eslint:
        patterns:
          - "@eslint/js"
          - "eslint"
      # Group Playwright dependencies together
      playwright:
        patterns:
          - "@playwright/test"
          - "playwright"
